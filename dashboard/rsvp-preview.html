<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة قوالب RSVP — لوحة تحكم جمرة غضى</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/dashboard-theme.css">
<style>
  *{box-sizing:border-box}
  body{font-family:Tahoma,Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{color:#d4af37;font-size:20px;margin:0}
  .back{color:#aaa;text-decoration:none;font-size:14px}
  .layout{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
  .card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;color:#d4af37;margin:0 0 12px}
  .hint{font-size:12px;color:#999;line-height:1.7}
  select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-family:inherit;font-size:14px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button,.link-btn{padding:9px 13px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:bold;cursor:pointer;font-family:inherit;text-decoration:none;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
  button.secondary,.link-btn.secondary{background:transparent;color:#ddd;border:1px solid #555}
  .template-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .template-list a{padding:9px 10px;border:1px solid #333;border-radius:8px;color:#ddd;text-decoration:none;font-size:12px;background:#161616}
  .template-list a.active{border-color:#d4af37;color:#d4af37}
  .preview-wrap{position:sticky;top:16px}
  .preview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .preview-head h2{margin:0;color:#d4af37;font-size:15px}
  iframe{display:block;width:100%;height:min(78vh,900px);border:1px solid #333;border-radius:14px;background:#fff}
  .url{font-size:11px;color:#888;word-break:break-all;margin-top:8px;direction:ltr;text-align:left}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.preview-wrap{position:static}.template-list{grid-template-columns:1fr 1fr}iframe{height:72vh}}
  @media(max-width:520px){.template-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="../js/dashboard-theme.js"></script>
<div class="topbar">
  <h1>👁️ معاينة قوالب تأكيد الحضور</h1>
  <a class="back" href="index.html">← رجوع للوحة</a>
</div>

<div class="layout">
  <aside>
    <div class="card">
      <h2>اختاري القالب</h2>
      <select id="templateSelect"></select>
      <div class="actions">
        <button id="refreshBtn">↻ تحديث المعاينة</button>
        <a id="openBtn" class="link-btn secondary" target="_blank" rel="noopener">فتح في تبويب جديد</a>
      </div>
      <div class="url" id="urlText"></div>
    </div>
    <div class="card">
      <h2>كل القوالب</h2>
      <div class="template-list" id="templateList"></div>
      <p class="hint" style="margin:12px 0 0">المعاينة هنا لا ترسل أي RSVP. الإرسال يعمل فقط من رابط الدعوة الفعلي المرتبط بالمناسبة والضيف.</p>
    </div>
  </aside>

  <main class="preview-wrap">
    <div class="preview-head">
      <h2 id="previewTitle">معاينة</h2>
      <span class="hint">تحديث مباشر من ملف القالب</span>
    </div>
    <iframe id="previewFrame" title="معاينة قالب RSVP"></iframe>
  </main>
</div>

<script>
const TEMPLATES = [
  ["زفاف — Silver", "wedding-silver"],
  ["زفاف — Royal", "wedding-royal"],
  ["زفاف — Classic", "wedding-classic"],
  ["زفاف — Modern", "wedding-modern"],
  ["زفاف — VIP", "wedding-vip"],
  ["زفاف — Golden Royal", "wedding-gold"],
  ["زفاف — Rose", "wedding-pink"],
  ["مولود", "baby-boy"],
  ["مولودة", "baby-girl"],
  ["تخرج — Luxury", "graduation-luxury"],
  ["تخرج — Classic", "graduation-classic"],
  ["شركات ومؤسسات", "corporate"],
  ["مؤتمرات وجمعيات", "conference"]
];
const select = document.getElementById('templateSelect');
const list = document.getElementById('templateList');
const frame = document.getElementById('previewFrame');
const openBtn = document.getElementById('openBtn');
const urlText = document.getElementById('urlText');
const title = document.getElementById('previewTitle');

TEMPLATES.forEach(([label, slug]) => {
  const opt = document.createElement('option');
  opt.value = slug; opt.textContent = label;
  select.appendChild(opt);
  const a = document.createElement('a');
  a.href = '#'; a.dataset.slug = slug; a.textContent = label;
  a.addEventListener('click', e => { e.preventDefault(); select.value = slug; loadPreview(); });
  list.appendChild(a);
});

function loadPreview() {
  const slug = select.value;
  const url = `/rsvp/${slug}.html?preview=1`;
  frame.src = url;
  openBtn.href = url;
  urlText.textContent = window.location.origin + url;
  title.textContent = `معاينة — ${select.options[select.selectedIndex].text}`;
  list.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.slug === slug));
}
select.addEventListener('change', loadPreview);
document.getElementById('refreshBtn').addEventListener('click', () => {
  frame.src = frame.src.split('#')[0] + (frame.src.includes('?') ? '&' : '?') + '_refresh=' + Date.now();
});
select.value = 'wedding-silver';
loadPreview();
</script>
</body>
</html>
