<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل العمليات — لوحة تحكم جمرة غضى</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box}
  body{font-family:Tahoma,Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  h1{color:#d4af37;font-size:20px;margin:0}
  a.back{color:#aaa;text-decoration:none;font-size:14px}
  .card{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:18px;margin-bottom:18px}
  .card h2{font-size:15px;color:#d4af37;margin-top:0}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:16px;text-align:center;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%}
  .stat.gold::before{background:#d4af37}
  .stat.green::before{background:#4caf50}
  .stat.blue::before{background:#2196f3}
  .stat .num{font-size:30px;font-weight:bold;line-height:1}
  .stat.gold .num{color:#d4af37}
  .stat.green .num{color:#4caf50}
  .stat.blue .num{color:#2196f3}
  .stat .label{font-size:11px;color:#999;margin-top:6px}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .search-wrap{flex:1;min-width:180px;position:relative}
  .search-wrap input{width:100%;padding:10px 36px 10px 12px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-family:inherit;font-size:14px}
  .search-wrap .icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#888;font-size:16px;pointer-events:none}
  select{padding:10px 12px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
  input[type="date"]{padding:10px 12px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-family:inherit;font-size:14px;cursor:pointer;color-scheme:dark}
  .btn{padding:10px 16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit}
  .btn-gold{background:#d4af37;color:#111}
  .btn-outline{background:transparent;border:1px solid #555;color:#ddd}
  .btn-excel{background:#1d6f42;color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:6px}

  /* Table */
  .table-wrap{overflow-x:auto;max-height:600px;overflow-y:auto}
  .table-wrap::-webkit-scrollbar{width:6px;height:6px}
  .table-wrap::-webkit-scrollbar-track{background:#1a1a1a}
  .table-wrap::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:right;padding:10px 8px;border-bottom:2px solid #333;color:#d4af37;white-space:nowrap;position:sticky;top:0;background:#1c1c1c;z-index:1}
  tbody td{padding:10px 8px;border-bottom:1px solid #2a2a2a;white-space:nowrap}
  tbody tr:hover{background:#222}
  .empty{color:#777;text-align:center;padding:30px;font-size:14px}
  .count-hint{font-size:12px;color:#888;margin-top:8px}
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:bold;white-space:nowrap}
  .badge.event{background:rgba(212,175,55,.15);color:#d4af37;border:1px solid rgba(212,175,55,.3)}
  .badge.guest{background:rgba(76,175,80,.15);color:#4caf50;border:1px solid rgba(76,175,80,.3)}
  .badge.template{background:rgba(33,150,243,.15);color:#2196f3;border:1px solid rgba(33,150,243,.3)}
  .badge.send_log{background:rgba(156,39,176,.15);color:#ce93d8;border:1px solid rgba(156,39,176,.3)}
  .badge.trash{background:rgba(224,122,95,.15);color:#e07a5f;border:1px solid rgba(224,122,95,.3)}
  .badge.backup{background:rgba(0,188,212,.15);color:#4dd0e1;border:1px solid rgba(0,188,212,.3)}
  .badge.integration{background:rgba(255,152,0,.15);color:#ffb74d;border:1px solid rgba(255,152,0,.3)}
  .badge.user{background:rgba(233,30,99,.15);color:#f48fb1;border:1px solid rgba(233,30,99,.3)}
  .detail-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .detail-cell:hover{color:#d4af37}
  .detail-expanded{white-space:normal;word-break:break-all;max-width:none}
  @media(max-width:600px){.stat .num{font-size:22px}.toolbar{flex-direction:column}.toolbar>*{width:100%}}
</style>
  <link rel="stylesheet" href="../css/dashboard-theme.css">
</head>
<body>
<script src="../js/dashboard-theme.js"></script>

<div class="topbar">
  <h1>📜 سجل العمليات</h1>
  <a class="back" href="index.html">← رجوع للوحة</a>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat gold"><div class="num" id="statTotal">0</div><div class="label">إجمالي العمليات</div></div>
  <div class="stat green"><div class="num" id="statToday">0</div><div class="label">عمليات اليوم</div></div>
  <div class="stat blue"><div class="num" id="statWeek">0</div><div class="label">عمليات هذا الأسبوع</div></div>
</div>

<div class="card">
  <h2>سجل العمليات</h2>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="بحث باسم المستخدم أو الإجراء...">
      <span class="icon">🔍</span>
    </div>
    <select id="filterEntity">
      <option value="all">كل الكيانات</option>
      <option value="event">فعالية</option>
      <option value="guest">ضيف</option>
      <option value="template">قالب</option>
      <option value="send_log">إرسال</option>
      <option value="trash">سلة محذوفات</option>
      <option value="backup">نسخ احتياطي</option>
      <option value="integration">تكامل</option>
      <option value="user">مستخدم</option>
    </select>
    <input type="date" id="dateFrom" title="من تاريخ">
    <input type="date" id="dateTo" title="إلى تاريخ">
    <button class="btn btn-outline btn-sm" id="clearFilters">مسح الفلاتر</button>
    <button class="btn btn-excel" id="exportExcel">📊 تصدير Excel</button>
  </div>

  <div class="table-wrap">
    <table id="logTable">
      <thead>
        <tr>
          <th>#</th>
          <th>الوقت</th>
          <th>المستخدم</th>
          <th>الكيان</th>
          <th>الإجراء</th>
          <th>التفاصيل</th>
          <th>IP</th>
        </tr>
      </thead>
      <tbody id="logBody">
        <tr><td colspan="7" class="empty">جارِ التحميل...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="count-hint" id="countHint"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import {
  db, auth, requireLogin,
  collection, query, orderBy, onSnapshot,
} from "../js/firebase-init.js";

let allLogs = [];
let unsub = null;

const entityLabels = {
  event: 'فعالية',
  guest: 'ضيف',
  template: 'قالب',
  send_log: 'إرسال',
  trash: 'سلة محذوفات',
  backup: 'نسخ احتياطي',
  integration: 'تكامل',
  user: 'مستخدم',
};

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatTime(ts) {
  if (!ts) return '—';
  const d = ts.toMillis ? new Date(ts.toMillis()) : new Date(ts);
  return d.toLocaleString('ar-SA', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
}

function isToday(ts) {
  if (!ts) return false;
  const d = ts.toMillis ? new Date(ts.toMillis()) : new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

function isThisWeek(ts) {
  if (!ts) return false;
  const d = ts.toMillis ? new Date(ts.toMillis()) : new Date(ts);
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay());
  startOfWeek.setHours(0, 0, 0, 0);
  return d >= startOfWeek;
}

requireLogin(() => {
  const q = query(collection(db, "operation_logs"), orderBy("time", "desc"));
  unsub = onSnapshot(q, (snap) => {
    allLogs = [];
    snap.forEach((d) => {
      const r = d.data();
      allLogs.push({
        id: d.id,
        time: r.time,
        user: r.user || '—',
        entity: r.entity || '—',
        action: r.action || '—',
        text: r.text || '',
        ip: r.ip || '—',
      });
    });
    updateStats();
    renderTable();
  }, () => {
    document.getElementById("logBody").innerHTML = '<tr><td colspan="7" class="empty">تعذّر تحميل البيانات</td></tr>';
  });
});

function updateStats() {
  document.getElementById("statTotal").textContent = allLogs.length;
  document.getElementById("statToday").textContent = allLogs.filter(l => isToday(l.time)).length;
  document.getElementById("statWeek").textContent = allLogs.filter(l => isThisWeek(l.time)).length;
}

function getFiltered() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const entityFilter = document.getElementById("filterEntity").value;
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;

  return allLogs.filter(l => {
    if (entityFilter !== 'all' && l.entity !== entityFilter) return false;
    if (search) {
      const matchUser = l.user.toLowerCase().includes(search);
      const matchAction = l.action.toLowerCase().includes(search);
      if (!matchUser && !matchAction) return false;
    }
    if (dateFrom) {
      const d = l.time ? (l.time.toMillis ? l.time.toMillis() : new Date(l.time).getTime()) : 0;
      const from = new Date(dateFrom).getTime();
      if (d < from) return false;
    }
    if (dateTo) {
      const d = l.time ? (l.time.toMillis ? l.time.toMillis() : new Date(l.time).getTime()) : Infinity;
      const to = new Date(dateTo).getTime() + 86400000;
      if (d > to) return false;
    }
    return true;
  });
}

function truncate(text, maxLen) {
  if (!text || text.length <= maxLen) return text || '';
  return text.slice(0, maxLen) + '...';
}

function renderTable() {
  const body = document.getElementById("logBody");
  const list = getFiltered();
  const hint = document.getElementById("countHint");

  if (!list.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">لا يوجد عمليات مطابقة</td></tr>';
    hint.textContent = '';
    return;
  }

  body.innerHTML = list.map((l, i) => {
    const entityLabel = entityLabels[l.entity] || l.entity;
    const entityCls = l.entity || '';
    const timeStr = formatTime(l.time);
    const detailText = truncate(l.text, 80);
    const fullDetail = l.text || '';
    const hasExpand = fullDetail.length > 80;

    return `<tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(timeStr)}</td>
      <td>${escapeHtml(l.user)}</td>
      <td><span class="badge ${escapeHtml(entityCls)}">${escapeHtml(entityLabel)}</span></td>
      <td>${escapeHtml(l.action)}</td>
      <td class="detail-cell${hasExpand ? '' : ''}" ${hasExpand ? `onclick="this.classList.toggle('detail-expanded');this.textContent=this.classList.contains('detail-expanded')?this.dataset.full:this.dataset.short"` : ''} ${hasExpand ? `data-short="${escapeHtml(detailText)}" data-full="${escapeHtml(fullDetail)}"` : ''}>${escapeHtml(detailText)}</td>
      <td dir="ltr" style="text-align:right;font-size:12px;color:#999">${escapeHtml(l.ip)}</td>
    </tr>`;
  }).join('');

  hint.textContent = `عرض ${list.length} من أصل ${allLogs.length} عملية`;
}

// ===== Filter events =====
document.getElementById("searchInput").addEventListener("input", renderTable);
document.getElementById("filterEntity").addEventListener("change", renderTable);
document.getElementById("dateFrom").addEventListener("change", renderTable);
document.getElementById("dateTo").addEventListener("change", renderTable);
document.getElementById("clearFilters").addEventListener("click", () => {
  document.getElementById("searchInput").value = '';
  document.getElementById("filterEntity").value = 'all';
  document.getElementById("dateFrom").value = '';
  document.getElementById("dateTo").value = '';
  renderTable();
});

// ===== Export Excel =====
document.getElementById("exportExcel").addEventListener("click", () => {
  const list = getFiltered();
  if (!list.length) { alert('لا يوجد بيانات للتصدير'); return; }
  const rows = list.map((l, i) => ({
    '#': i + 1,
    'الوقت': formatTime(l.time),
    'المستخدم': l.user,
    'الكيان': entityLabels[l.entity] || l.entity,
    'الإجراء': l.action,
    'التفاصيل': l.text || '',
    'IP': l.ip || '',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'سجل العمليات');
  XLSX.writeFile(wb, `operation-log-${new Date().toISOString().slice(0, 10)}.xlsx`);
});

// ===== Cleanup =====
window.addEventListener("beforeunload", () => { if (unsub) unsub(); });
</script>
</body>
</html>
