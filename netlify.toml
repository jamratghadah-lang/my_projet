[build]
publish = "."
command = "npm run build"

[functions]
[functions.daily-report]
schedule = "0 8 * * *"

[functions.event-reminder]
schedule = "0 * * * *"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"

[[redirects]]
from = "/admin"
to = "/admin/index.html"
status = 200

[[redirects]]
from = "/dashboard"
to = "/dashboard/index.html"
status = 200

[[redirects]]
from = "/:slug"
to = "/.netlify/functions/couple-router"
status = 200